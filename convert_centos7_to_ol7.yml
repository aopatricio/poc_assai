---
- name: Conversao de CentOS 7 para Oracle Linux 7 com alteracao de hostname
  hosts: centos7
  become: true
  gather_facts: yes

  vars:
    # Hostname desejado (pode sobrescrever no inventory ou extra-vars)
    new_hostname: "ol7-{{ var_new_hostname }}"

    # Script oficial Oracle
    centos2ol_url: https://raw.githubusercontent.com/oracle/centos2ol/main/centos2ol.sh
    centos2ol_path: /root/centos2ol.sh

  pre_tasks:

    - name: Validar se o sistema é CentOS 7
      assert:
        that:
          - ansible_distribution == "CentOS"
          - ansible_distribution_major_version == "7"
        fail_msg: "Este playbook só pode ser executado em CentOS 7"
        success_msg: "Sistema validado: CentOS 7"

    - name: Alterar hostname do servidor
      hostname:
        name: "{{ new_hostname }}"

    - name: Atualizar /etc/hosts com o novo hostname
      lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.0\.1'
        line: "127.0.0.1   {{ new_hostname }} localhost"
        state: present

  tasks:

    - name: Atualizar todos os pacotes do CentOS
      yum:
        name: "*"
        state: latest

    - name: Instalar dependencias necessarias
      yum:
        name:
          - curl
          - bash
          - yum-utils
        state: present

    - name: Download do script centos2ol.sh
      get_url:
        url: "{{ centos2ol_url }}"
        dest: "{{ centos2ol_path }}"
        mode: '0755'

    - name: Executar conversao CentOS -> Oracle Linux
      command: bash {{ centos2ol_path }}
      args:
        creates: /etc/oracle-release
      register: centos2ol_result

    - name: Exibir saida da conversao
      debug:
        var: centos2ol_result.stdout_lines

  post_tasks:

    - name: Validar se Oracle Linux foi instalado
      stat:
        path: /etc/oracle-release
      register: oracle_release

    - name: Falhar se conversao nao ocorreu
      fail:
        msg: "Conversao falhou. /etc/oracle-release nao encontrado."
      when: not oracle_release.stat.exists

    - name: Reiniciar o servidor apos conversao
      reboot:
        reboot_timeout: 1800
        msg: "Reboot apos conversao para Oracle Linux 7"

    - name: Verificar versao do Oracle Linux apos reboot
      command: cat /etc/oracle-release
      register: ol_version
      changed_when: false

    - name: Exibir versao final do sistema
      debug:
        msg: "Sistema convertido com sucesso: {{ ol_version.stdout }}"
