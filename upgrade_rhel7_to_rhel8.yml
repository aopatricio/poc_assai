---
- name: Migração in-place RHEL 7 para RHEL 8 com Leapp
  hosts: centos7
  become: yes
  gather_facts: yes

  vars:
    required_rhel_version: "7.9"
    leapp_packages:
      - leapp
      - leapp-repository
      - leapp-upgrade-el7toel8

  tasks:

  ####################################################################
  # PRE-CHECKS
  ####################################################################

  - name: Verificar versão do RHEL
    command: cat /etc/redhat-release
    register: rhel_release

  - name: Garantir que é RHEL 7.9
    fail:
      msg: "Sistema não está no RHEL 7.9. Migração abortada."
    when: required_rhel_version not in rhel_release.stdout

  - name: Verificar se sistema está registrado no subscription-manager
    command: subscription-manager status
    register: sub_status

  - name: Falhar se subscription não estiver válida
    fail:
      msg: "Subscription inválida ou não registrada."
    when: "'Overall Status: Current' not in sub_status.stdout"

  - name: Verificar SELinux
    command: getenforce
    register: selinux_status

  - name: Garantir SELinux em Enforcing ou Permissive
    fail:
      msg: "SELinux está Disabled. Corrija antes de continuar."
    when: selinux_status.stdout == "Disabled"

  - name: Verificar espaço em disco /
    command: df -h /
    register: disk_root

  - name: Exibir espaço em disco
    debug:
      var: disk_root.stdout_lines

  - name: Aviso de snapshot
    debug:
      msg: "⚠️ CONFIRME snapshot/backup antes de continuar"

  ####################################################################
  # PREPARAÇÃO DO SISTEMA
  ####################################################################

  - name: Atualizar sistema RHEL 7
    yum:
      name: "*"
      state: latest

  - name: Reboot após atualização
    reboot:
      reboot_timeout: 600

  - name: Habilitar repositórios necessários
    command: subscription-manager repos --enable=rhel-7-server-rpms

  ####################################################################
  # INSTALAÇÃO DO LEAPP
  ####################################################################

  - name: Instalar pacotes do Leapp
    yum:
      name: "{{ leapp_packages }}"
      state: present

  ####################################################################
  # LEAPP PREUPGRADE
  ####################################################################

  - name: Executar leapp preupgrade
    command: leapp preupgrade
    register: preupgrade
    failed_when: false

  - name: Ler relatório do Leapp
    command: cat /var/log/leapp/leapp-report.txt
    register: leapp_report

  - name: Mostrar relatório do Leapp
    debug:
      var: leapp_report.stdout_lines

  - name: Falhar se houver erros HIGH
    fail:
      msg: "Leapp encontrou erros críticos (HIGH). Corrija antes de continuar."
    when: "'HIGH' in leapp_report.stdout"

  ####################################################################
  # LEAPP UPGRADE
  ####################################################################

  - name: Executar leapp upgrade
    command: leapp upgrade
    async: 7200
    poll: 15

  - name: Reboot para iniciar o upgrade
    reboot:
      reboot_timeout: 3600

  ####################################################################
  # POST-CHECKS
  ####################################################################

  - name: Verificar versão do RHEL após upgrade
    command: cat /etc/redhat-release
    register: new_release

  - name: Mostrar nova versão
    debug:
      msg: "{{ new_release.stdout }}"

  - name: Garantir que sistema está no RHEL 8
    fail:
      msg: "Upgrade falhou. Sistema não está no RHEL 8."
    when: "'release 8' not in new_release.stdout"

  - name: Verificar kernel
    command: uname -r
    register: kernel_version

  - name: Mostrar kernel
    debug:
      msg: "Kernel atual: {{ kernel_version.stdout }}"

  - name: Garantir SSH ativo
    systemd:
      name: sshd
      state: started
      enabled: yes

  - name: Limpar pacotes obsoletos
    command: dnf autoremove -y

  - name: Verificar SELinux após upgrade
    command: getenforce
    register: selinux_after

  - name: Mostrar status do SELinux
    debug:
      msg: "SELinux após upgrade: {{ selinux_after.stdout }}"

  - name: Finalização
    debug:
      msg: "✅ Migração RHEL 7 → RHEL 8 concluída com sucesso"
