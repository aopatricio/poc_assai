---
- name: Upgrade RHEL 7 para RHEL 8 com Leapp (RHSM user/password)
  hosts: rhel7
  become: true
  gather_facts: yes

  vars:
    required_rhel_version: "7.9"
    rhsm_user: "{{ var_rhsm_user }}"
    rhsm_pass: "{{ var_rhsm_pass }}"
    rhsm_pool: "{{ var_rhsm_poolid }}"
    leapp_answerfile: /var/log/leapp/answerfile

  pre_tasks:
    - name: Validar se o SO é RHEL 7
      fail:
        msg: "Este playbook só pode ser executado em RHEL 7"
      when:
        - ansible_distribution != "RedHat"
        - ansible_distribution_major_version != "7"

    - name: Atualizar todos os pacotes do RHEL 7
      yum:
        name: "*"
        state: latest

    - name: Reboot após atualização
      reboot:
        reboot_timeout: 1800

  tasks:

    - name: Registrar o sistema usando usuário e senha RHSM
      redhat_subscription:
        state: present
        username: "{{ rhsm_user }}"
        password: "{{ rhsm_password }}"
        auto_attach: true

    - name: Habilitar repositórios necessários do RHEL 7
      command: >
        subscription-manager repos
        --enable=rhel-7-server-rpms
        --enable=rhel-7-server-extras-rpms
        --enable=rhel-7-server-optional-rpms

    - name: Garantir que o Leapp e dependências estão instalados
      yum:
        name:
          - leapp
          - leapp-repository
        state: present

    - name: Criar answerfile do Leapp (evita prompts interativos)
      shell: leapp answer --section remove_pam_pkcs11_module_check.confirm=True
      args:
        creates: "{{ leapp_answerfile }}"

    - name: Executar validação pre-upgrade
      command: leapp preupgrade
      register: preupgrade_output
      failed_when: false

    - name: Exibir saída do preupgrade
      debug:
        var: preupgrade_output.stdout_lines

    - name: Verificar se existem Inhibitors (bloqueios)
      shell: |
        grep -i "inhibitor" /var/log/leapp/leapp-report.txt
      register: inhibitor_check
      failed_when: inhibitor_check.rc == 0

    - name: Executar upgrade para RHEL 8
      command: leapp upgrade
      async: 3600
      poll: 30

    - name: Reboot para concluir a migração
      reboot:
        reboot_timeout: 3600

  post_tasks:

    - name: Validar versão final do sistema
      command: cat /etc/redhat-release
      register: rhel_version

    - name: Exibir versão após upgrade
      debug:
        msg: "Sistema após upgrade: {{ rhel_version.stdout }}"

    - name: Remover pacotes órfãos pós-upgrade
      dnf:
        autoremove: yes
